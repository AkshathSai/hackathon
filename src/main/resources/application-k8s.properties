server.port=8085
spring.application.name=hackathon
spring.threads.virtual.enabled=true

# MongoDB configuration for Kubernetes
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongodb-service:27017/ecomapp}

# Kafka configuration for Kubernetes
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-service:9092}

# Producer config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Consumer config
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.info.header=false
spring.kafka.consumer.group-id=hackathon-group
spring.kafka.consumer.auto-offset-reset=earliest

# Actuator configuration for production
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.readiness-state.enabled=true
management.health.liveness-state.enabled=true
management.endpoint.health.probes.enabled=true

# Logging configuration
logging.level.com.ecom.hackathon=INFO
logging.level.org.springframework.kafka=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
