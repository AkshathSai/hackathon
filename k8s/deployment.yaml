apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackathon-app
  labels:
    app: hackathon-app
spec:
  replicas: 1  # Reduced from 2 for free tier
  selector:
    matchLabels:
      app: hackathon-app
  template:
    metadata:
      labels:
        app: hackathon-app
    spec:
      containers:
      - name: hackathon-app
        image: ghcr.io/${{ github.repository }}:${IMAGE_TAG:-latest}
        ports:
        - containerPort: 8085
        env:
        - name: SPRING_DATA_MONGODB_URI
          value: "mongodb://mongodb-service:27017/ecomapp"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-service:9092"
        - name: SERVER_PORT
          value: "8085"
        - name: JAVA_OPTS
          value: "-Xmx384m -Xms128m"  # Reduced memory for free tier
        resources:
          requests:
            memory: "256Mi"  # Reduced from 512Mi
            cpu: "100m"      # Reduced from 250m
          limits:
            memory: "512Mi"  # Reduced from 1Gi
            cpu: "300m"      # Reduced from 500m
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8085
          initialDelaySeconds: 90  # Increased for slower startup
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8085
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: hackathon-service
  labels:
    app: hackathon-app
spec:
  type: NodePort  # Changed from LoadBalancer for Minikube compatibility
  selector:
    app: hackathon-app
  ports:
  - port: 8085
    targetPort: 8085
    nodePort: 30085  # Fixed port for easy access
    protocol: TCP
    name: http
