apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackathon-app
  labels:
    app: hackathon-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hackathon-app
  template:
    metadata:
      labels:
        app: hackathon-app
    spec:
      containers:
      - name: hackathon-app
        image: ghcr.io/${{ github.repository }}:${IMAGE_TAG:-latest}
        ports:
        - containerPort: 8085
        env:
        - name: SPRING_DATA_MONGODB_URI
          value: "mongodb://mongodb-service:27017/ecomapp"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-service:9092"
        - name: SERVER_PORT
          value: "8085"
        - name: JAVA_OPTS
          value: "-Xmx200m -Xms64m -XX:MaxMetaspaceSize=128m"  # Ultra-minimal for 1-core
        resources:
          requests:
            memory: "128Mi"  # Reduced for 1-core Killercoda
            cpu: "50m"       # Ultra-minimal CPU
          limits:
            memory: "256Mi"  # Reduced limits
            cpu: "200m"      # Conservative CPU limit
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8085
          initialDelaySeconds: 120  # Extended for slow 1-core startup
          periodSeconds: 45
          timeoutSeconds: 15
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8085
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hackathon-service
  labels:
    app: hackathon-app
spec:
  type: NodePort
  selector:
    app: hackathon-app
  ports:
  - port: 8085
    targetPort: 8085
    nodePort: 30085
    protocol: TCP
    name: http
