apiVersion: v1
kind: ResourceQuota
metadata:
  name: free-tier-quota
  namespace: default
spec:
  hard:
    # CPU limits for free tier
    requests.cpu: "1"
    limits.cpu: "2"
    # Memory limits for free tier
    requests.memory: 1Gi
    limits.memory: 2Gi
    # Storage limits
    persistentvolumeclaims: "3"
    requests.storage: "5Gi"
    # Pod limits
    pods: "10"
    services: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: free-tier-limits
  namespace: default
spec:
  limits:
  - default:
      cpu: "200m"
      memory: "256Mi"
    defaultRequest:
      cpu: "50m"
      memory: "128Mi"
    type: Container
  - max:
      cpu: "500m"
      memory: "512Mi"
    min:
      cpu: "10m"
      memory: "32Mi"
    type: Container

