apiVersion: v1
kind: ResourceQuota
metadata:
  name: killercoda-quota
  namespace: default
spec:
  hard:
    # Ultra-minimal CPU limits for 1-core Killercoda
    requests.cpu: "800m"
    limits.cpu: "1000m"
    # Minimal memory limits for 1-core environment
    requests.memory: 800Mi
    limits.memory: 1200Mi
    # Reduced storage limits
    persistentvolumeclaims: "2"
    requests.storage: "3Gi"
    # Minimal pod limits
    pods: "8"
    services: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: killercoda-limits
  namespace: default
spec:
  limits:
  - default:
      cpu: "100m"
      memory: "128Mi"
    defaultRequest:
      cpu: "25m"
      memory: "64Mi"
    max:
      cpu: "300m"
      memory: "256Mi"
    min:
      cpu: "10m"
      memory: "32Mi"
    type: Container
