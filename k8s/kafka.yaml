apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  labels:
    app: zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.4.0
        ports:
        - containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx64m -Xms32m"  # Ultra-minimal for 1-core
        resources:
          requests:
            memory: "64Mi"   # Ultra-minimal for 1-core
            cpu: "25m"       # Minimal CPU
          limits:
            memory: "128Mi"  # Conservative limits
            cpu: "100m"      # Reduced CPU limit
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  labels:
    app: zookeeper
spec:
  selector:
    app: zookeeper
  ports:
  - port: 2181
    targetPort: 2181
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.4.0
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper-service:2181"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka-service:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "true"
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx128m -Xms64m"  # Ultra-minimal for 1-core
        - name: KAFKA_LOG_RETENTION_HOURS
          value: "1"
        - name: KAFKA_LOG_SEGMENT_BYTES
          value: "26214400"  # 25MB segments for storage savings
        - name: KAFKA_NUM_NETWORK_THREADS
          value: "2"  # Reduced network threads
        - name: KAFKA_NUM_IO_THREADS
          value: "2"  # Reduced IO threads
        resources:
          requests:
            memory: "128Mi"  # Minimal for 1-core
            cpu: "50m"       # Ultra-minimal CPU
          limits:
            memory: "256Mi"  # Conservative limits
            cpu: "150m"      # Reduced CPU limit
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "timeout 15 kafka-topics --bootstrap-server localhost:9092 --list"
          initialDelaySeconds: 60  # Extended for 1-core startup
          periodSeconds: 30
          timeoutSeconds: 20
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  labels:
    app: kafka
spec:
  selector:
    app: kafka
  ports:
  - port: 9092
    targetPort: 9092
    protocol: TCP
