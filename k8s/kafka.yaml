apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  labels:
    app: zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.4.0
        ports:
        - containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx128m -Xms64m"  # Minimal memory allocation
        resources:
          requests:
            memory: "96Mi"   # Reduced from 256Mi
            cpu: "50m"       # Reduced from 250m
          limits:
            memory: "192Mi"  # Reduced from 512Mi
            cpu: "150m"      # Reduced from 500m
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  labels:
    app: zookeeper
spec:
  selector:
    app: zookeeper
  ports:
  - port: 2181
    targetPort: 2181
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.4.0
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper-service:2181"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka-service:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "true"
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx256m -Xms128m"  # Minimal memory allocation
        - name: KAFKA_LOG_RETENTION_HOURS
          value: "1"  # Reduce log retention for storage savings
        - name: KAFKA_LOG_SEGMENT_BYTES
          value: "52428800"  # 50MB segments instead of default 1GB
        resources:
          requests:
            memory: "256Mi"  # Reduced from 512Mi
            cpu: "100m"      # Reduced from 250m
          limits:
            memory: "384Mi"  # Reduced from 1Gi
            cpu: "200m"      # Reduced from 500m
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "timeout 10 kafka-topics --bootstrap-server localhost:9092 --list"
          initialDelaySeconds: 45  # Increased for slower startup
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  labels:
    app: kafka
spec:
  selector:
    app: kafka
  ports:
  - port: 9092
    targetPort: 9092
    protocol: TCP
